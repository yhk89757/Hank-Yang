// ========================= MAIN PRESENTATION =========================

function Presentation({ onBack }) {
  const [currentSlide, setCurrentSlide] = useState(0);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const [transitioning, setTransitioning] = useState(false);
  const totalSlides = SLIDES + 1;

  const goTo = useCallback((index) => {
    if (index < 0 || index >= totalSlides || transitioning) return;
    setTransitioning(true);
    setCurrentSlide(index);
    setTimeout(() => setTransitioning(false), 450);
  }, [totalSlides, transitioning]);

  const next = useCallback(() => goTo(currentSlide + 1), [currentSlide, goTo]);
  const prev = useCallback(() => goTo(currentSlide - 1), [currentSlide, goTo]);

  const toggleFullscreen = useCallback(() => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      setIsFullscreen(true);
    } else {
      document.exitFullscreen();
      setIsFullscreen(false);
    }
  }, []);

  useEffect(() => {
    const handleKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        next();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        prev();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'Escape') {
        if (document.fullscreenElement) {
          document.exitFullscreen();
          setIsFullscreen(false);
        }
      }
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [next, prev, toggleFullscreen]);

  const slideComponents = [
    <Slide1 key="s1" />,
    <Slide2 key="s2" />,
    <Slide3 key="s3" />,
    <Slide4 key="s4" />,
    <Slide5 key="s5" />,
    <ClosingSlide key="closing" />,
  ];

  const isClosing = currentSlide === SLIDES;

  return (
    <div className="fixed inset-0 bg-[#F7F8FA] overflow-hidden">
      
      {/* Slide counter + controls */}
      <div className="fixed top-6 right-6 z-50 flex items-center gap-3">
        {!isClosing ? (
          <span className="text-[#86909C] text-sm font-mono font-bold tracking-wide">
            {String(currentSlide + 1).padStart(2, '0')} / {String(SLIDES).padStart(2, '0')}
          </span>
        ) : (
          <span className="text-[#0052D9] text-sm font-mono font-bold">✨ 结尾升华</span>
        )}
        
        <button
          onClick={toggleFullscreen}
          className="w-9 h-9 rounded-xl bg-white border border-[#E5E6EB] flex items-center justify-center text-[#86909C] hover:text-[#0052D9] hover:border-[#0052D9]/30 transition-all text-sm shadow-sm"
          title="全屏 (F)"
        >
          {isFullscreen ? '⊠' : '⛶'}
        </button>
        
        {onBack && (
          <button
            onClick={onBack}
            className="px-4 py-1.5 rounded-xl bg-white border border-[#E5E6EB] text-[#86909C] text-xs font-bold hover:text-[#0052D9] hover:border-[#0052D9]/30 transition-all shadow-sm"
          >
            返回登录
          </button>
        )}
      </div>
      
      {/* Slide content */}
      <div className="w-full h-full">
        {slideComponents[currentSlide]}
      </div>
      
      {/* Navigation dots */}
      <div className="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-3 z-50">
        {Array.from({ length: totalSlides }).map((_, i) => (
          <button
            key={i}
            onClick={() => goTo(i)}
            className={`
              transition-all duration-300 rounded-full
              ${i === currentSlide 
                ? 'w-3 h-3 bg-[#0052D9] shadow-md shadow-[#0052D9]/20' 
                : i === SLIDES
                ? 'w-2 h-2 bg-[#618DFF]/40 hover:bg-[#618DFF]/60'
                : 'w-2 h-2 bg-[#C9CDD4] hover:bg-[#86909C]'
              }
            `}
          />
        ))}
      </div>
      
      {/* Navigation arrows */}
      {currentSlide > 0 && (
        <button
          onClick={prev}
          className="fixed left-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white border border-[#E5E6EB] flex items-center justify-center text-[#86909C] hover:text-[#0052D9] hover:border-[#0052D9]/30 hover:shadow-md transition-all z-50 shadow-sm"
        >
          ←
        </button>
      )}
      {currentSlide < totalSlides - 1 && (
        <button
          onClick={next}
          className="fixed right-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-[#0052D9] flex items-center justify-center text-white hover:bg-[#003EB3] hover:shadow-lg transition-all z-50 shadow-md"
        >
          →
        </button>
      )}
    </div>
  );
}
